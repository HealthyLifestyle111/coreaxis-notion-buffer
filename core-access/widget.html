<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Core Access — Find Your Path</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:0 auto;padding:48px 20px}button{display:block;width:100%;padding:16px;margin:10px 0;border:1px solid #ccc;border-radius:12px;background:#fff;text-align:left;font-size:16px}button:hover{border-color:#111}.hidden{display:none}.result{padding:24px;border:1px solid #ddd;border-radius:16px;margin-top:20px}</style></head><body><main><p>CORE ACCESS</p><h1>Let’s find the right place to begin.</h1><p>Tell us what you’re looking for. We’ll narrow it down for you.</p><section id="q"></section><section id="r" class="result hidden"></section></main><script>
const state={};const q=document.querySelector('#q'),r=document.querySelector('#r');
function ask(title,opts){q.innerHTML=`<h2>${title}</h2>`+opts.map(([v,t])=>`<button data-v="${v}">${t}</button>`).join('');q.querySelectorAll('button').forEach(b=>b.onclick=()=>{state[title]=b.dataset.v;next(b.dataset.v)});}
function next(v){if(!state.intent){if(v==='known-peptide')return show('peptide_direct','You can go directly to the approved peptide destination.','DIRECT_ELLIE_MD');if(v==='known-cellcore')return show('cellcore_direct','You can go directly to the approved CellCore route.','DIRECT_CELLCORE');if(v==='unknown')return ask('What are you looking for?',[['womens','Women’s whole-person wellness'],['menopause','Perimenopause or menopause'],['fertility','Fertility or preconception'],['mens','Men’s vitality'],['pet','Pet wellness'],['household','Household support'],['foundational','Foundational support'],['multiple','I have multiple concerns']]);state.intent=v;return next(v)} if(v==='multiple')return show('concierge_review','Concierge review will determine the best first door for you.','HUMAN_REVIEW');const map={womens:['pomegranate','Pomegranate — Whole Woman Foundations','BEGIN_POMEGRANATE'],menopause:['menopause_core','Menopause Core','EXPLORE_MENOPAUSE_CORE'],fertility:['ovo','OVO — Fertility & Preparation','BEGIN_OVO'],mens:['oyster','Oyster — Men’s Vitality','BEGIN_OYSTER'],pet:['vibrant_pets','Vibrant Pets','BEGIN_VIBRANT_PETS'],household:['healthier_together','Healthier Together','BEGIN_HEALTHIER_TOGETHER'],foundational:['cellular_cleanse','Cellular Cleanse','BEGIN_CELLULAR_CLEANSE_ASSESSMENT']};return show(...map[v]);}
function show(route,label,action){q.innerHTML='';r.classList.remove('hidden');r.innerHTML=`<h2>${label}</h2><p>That is the clearest place to begin based on what you told us.</p><button>${action}</button>`}
ask('Do you already know what you’re looking for?',[['known-peptide','I want peptide access'],['known-cellcore','I want CellCore / JumpStart'],['unknown','No — help me find the right place']]);
</script></body></html>
