name: CoreAxis Deployment CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/final-ci-validation]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run verify:production
      - run: npm run campaign:sample
      - run: docker build -t coreaxis-approval-studio .
      - name: Run container
        run: |
          docker run -d --name coreaxis-studio -p 4173:4173 \
            -e COREAXIS_ADMIN_USER=coreaxis \
            -e COREAXIS_ADMIN_PASSWORD=test-password \
            coreaxis-approval-studio
      - name: Health and authentication checks
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/api/health | grep -q '"ok":true'; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker logs coreaxis-studio
              exit 1
            fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/)" = "401"
          test "$(curl -s -u coreaxis:test-password -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/)" = "200"
          test "$(curl -s -u coreaxis:test-password -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/readiness)" = "200"
      - name: Container logs
        if: always()
        run: docker logs coreaxis-studio || true
