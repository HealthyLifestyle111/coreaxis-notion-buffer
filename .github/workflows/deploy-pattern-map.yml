name: Deploy Menopause Core Pattern Map
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: pattern-map-react
        run: npm install
      - name: Build React app
        working-directory: pattern-map-react
        run: npm run build
      - name: Assemble Pages artifact
        run: |
          mkdir -p public/pattern-map
          cp -R docs/. public/
          cp -R pattern-map-react/dist/. public/pattern-map/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
