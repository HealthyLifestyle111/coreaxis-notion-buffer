name: Notion Publishing Sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notion-buffer-sync.yml'
      - 'scripts/notion-metricool-sync.mjs'
      - 'scripts/notion-buffer-sync.mjs'
      - 'scripts/publishing-routing.mjs'
      - 'test/**'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: notion-publishing-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - name: Test publisher routing and duplicate prevention
        run: npm test
      - name: Check Metricool executor availability
        id: metricool
        env:
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
        run: |
          if [ -n "$METRICOOL_USER_TOKEN" ] && [ -n "$METRICOOL_USER_ID" ] && [ -n "$METRICOOL_BLOG_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Metricool executor is unavailable; connected Buffer routes will continue independently."
          fi
      - name: Publish approved Metricool routes
        if: steps.metricool.outputs.ready == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: '2fc38cda2cba491cb090d4f09d0ec1d2'
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
        run: node scripts/notion-metricool-sync.mjs
      # Buffer must continue even when the optional Metricool executor is unavailable.
      # Buffer validates platform limits and public media before returning a scheduler ID.
      - name: Publish approved Buffer routes
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: '2fc38cda2cba491cb090d4f09d0ec1d2'
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/notion-buffer-sync.mjs
